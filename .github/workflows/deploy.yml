name: Deploy

# Runs after CI succeeds on main, never on the push itself.
#
# The ordering matters more than it looks: a migration is the one step that
# cannot be rolled back by redeploying, so it must never run from a commit whose
# tests failed. `workflow_run` gives that guarantee; a plain `push` trigger would
# race CI and could migrate production from a red build.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# One deploy at a time. Two overlapping runs would race the same database and
# the same service, and `cancel-in-progress` is deliberately off — cancelling a
# half-applied migration is worse than queueing behind it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # §19.1: schema first, then the code that depends on it. Prisma's forward-only
  # migrations mean the old API can run against the new schema for the length of
  # the deploy window; the reverse is not true.
  migrate:
    # F1. `on.workflow_run.branches` above filters on the *head* branch of the
    # triggering run, not on a branch of this repository — and a fork's default
    # branch is called `main` too. So `branches: [main]` alone lets CI for a
    # pull request from a fork start this deploy, which would check out the
    # fork's commit and run its `.yarn/releases/*.cjs` (`.yarnrc.yml` names it)
    # with the production database URL in the environment.
    #
    # These four clauses are the gate. `head_repository` is the field that
    # separates this repository's `main` from a fork's; if GitHub ever omits it
    # the comparison is false and the job skips, which is the safe direction.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # Defence in depth, and where a deploy's history is visible as a list: the
    # three production secrets are scoped to this environment rather than to the
    # whole repository, so they have one place to be revoked from.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Pinned by commit SHA, not by tag (P-5). This workflow holds the
      # deploy hook and the production database URL, so a moved tag here is
      # worth more to an attacker than the same tag in CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This repository's own `main`, with full history, so the check below
          # has something to check against. The triggering commit is not on disk
          # yet — that is the point of doing this first.
          ref: main
          fetch-depth: 0

      # Runs before setup-node, and so before any install: `yarn install` would
      # execute the checkout's own Yarn release, which for a fork's commit is
      # the attacker's file. Prints the four gate values so a skipped or failed
      # deploy says why in its own log.
      - name: the approved commit is on main
        env:
          WANT: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "event=${{ github.event.workflow_run.event }} head=${{ github.event.workflow_run.head_branch }} repo=${{ github.event.workflow_run.head_repository.full_name }}"
          git merge-base --is-ancestor "$WANT" origin/main || { echo "::error::$WANT is not on main"; exit 1; }
          # The exact commit CI approved, not whatever main points at now — now
          # that it is proven to be one of main's ancestors.
          git checkout --detach "$WANT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable

      - name: fail early if the deploy is not configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          missing=""
          [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL"
          [ -z "$RENDER_DEPLOY_HOOK_URL" ] && missing="$missing RENDER_DEPLOY_HOOK_URL"
          [ -z "$PRODUCTION_URL" ] && missing="$missing PRODUCTION_URL"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "Set them under Settings → Secrets and variables → Actions (runbook T-6.1)."
            exit 1
          fi

      # `migrate deploy` applies committed migrations and never authors one,
      # which is what a non-interactive environment needs.
      # No `prisma generate` here: `migrate deploy` reads the schema and the
      # connection string and nothing else. The step used to exist, without
      # DATABASE_URL in its environment, and failed with
      # `PrismaConfigEnvError: Cannot resolve environment variable` — a
      # migration job brought down by a client it never uses.
      #
      # DATABASE_URL_UNPOOLED is the direct connection. Neon's pooler may hand
      # a migration's statements to different backends, and the failure mode is
      # a half-applied migration rather than a clean refusal. Optional: where
      # there is no pooler the config falls back to DATABASE_URL.
      - name: apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: yarn workspace @wallet/api exec prisma migrate deploy

  release:
    needs: migrate
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # A deploy hook takes a plain GET or POST and answers 200 with the new
      # deploy's id, or 202 when it is queued.
      - name: trigger the deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          code=$(curl -sS -o /tmp/hook.json -w '%{http_code}' -X POST "$HOOK")
          echo "deploy hook: HTTP $code"
          if [ "$code" != "200" ] && [ "$code" != "202" ]; then
            echo "hook refused the request"; cat /tmp/hook.json; exit 1
          fi

      # Waits for the new build to answer, rather than sleeping and hoping.
      #
      # `/health` reports the commit it was built from (RENDER_GIT_COMMIT), so
      # "the deploy finished" is a fact this workflow can check without a Render
      # API token. The free tier also cold-starts, so the budget is generous:
      # the first response can take the better part of a minute.
      - name: wait for the new commit to be live
        env:
          BASE: ${{ secrets.PRODUCTION_URL }}
          WANT: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in $(seq 1 60); do
            got=$(curl -sS --max-time 20 "${BASE%/}/health" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            if [ "$got" = "$WANT" ]; then
              echo "live: ${got:0:7} after ${attempt} checks"; exit 0
            fi
            echo "attempt ${attempt}: serving ${got:-<no answer>}"
            sleep 10
          done
          echo "the deployed commit never became live within 10 minutes"
          exit 1

  smoke:
    needs: release
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The same two steps as `migrate`, for the same reason: this job also
      # checks out `head_sha` and installs from it. A skipped `migrate` skips
      # this job, but the proof is repeated rather than inherited — `needs:` is
      # an ordering, not a guarantee about what is on this runner's disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: the approved commit is on main
        env:
          WANT: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "event=${{ github.event.workflow_run.event }} head=${{ github.event.workflow_run.head_branch }} repo=${{ github.event.workflow_run.head_repository.full_name }}"
          git merge-base --is-ancestor "$WANT" origin/main || { echo "::error::$WANT is not on main"; exit 1; }
          git checkout --detach "$WANT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable

      # T-6.3: health, register, login and a transfer that completes. A deploy
      # that boots but cannot move money is a failed deploy.
      - name: production smoke
        env:
          SMOKE_BASE_URL: ${{ secrets.PRODUCTION_URL }}
          SMOKE_EXPECTED_VERSION: ${{ github.event.workflow_run.head_sha }}
        run: yarn workspace @wallet/api smoke
