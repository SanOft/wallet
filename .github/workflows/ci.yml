name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only, and stated rather than inherited (P-5). The default for a
# repository can be write, which would hand every third-party action in this
# file a token that can push to `main`. Nothing here needs to write anything.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung job otherwise occupies a runner for six hours, which is the
    # default. Two minutes is the observed time; ten leaves room for a cold
    # cache without leaving room for a hang.
    timeout-minutes: 10

    strategy:
      # Both versions are reported. `fail-fast` would cancel the surviving job
      # the moment one went red, which hides whether the break is version
      # specific — the one question a matrix exists to answer.
      fail-fast: false
      matrix:
        # `engines` claims `^22.0.0 || >=24.0.0` and only 22 was ever exercised
        # (P-5), so half of that was a claim nothing checked. Public repository,
        # so the two jobs run in parallel at no wall-clock cost.
        node: [22, 24]

    # Integration tests run against a real database on every pull request
    # (spec §18.1). A mock would not exercise the CHECK constraints that hold
    # the ledger invariants, which is the half most worth testing.
    services:
      postgres:
        # Pinned by digest, not by tag (P-3). `postgres:17-alpine` moves, so a
        # run that was green in August is not reproducible in December — and
        # the constraints and triggers this suite depends on are the database's
        # behaviour, not ours. Digest for 17-alpine as of 2026-08-29.
        image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          POSTGRES_DB: wallet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Ephemeral service container on localhost; these credentials exist for
      # the length of one job and reach nothing outside it.
      DATABASE_URL: postgresql://wallet:wallet@localhost:5432/wallet?schema=public
      # The API refuses to boot without one (NFR-1.9), so the integration tests
      # need it too. Ephemeral and job-scoped, like the database credentials.
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

    steps:
      # Pinned by commit SHA rather than by tag (P-5). A tag is a mutable
      # pointer somebody else controls: `v7` can be moved onto a different
      # commit at any time, and this workflow holds a token and reads every
      # file in the repository. The trailing comment is the human-readable
      # version, and it is the only part a reader can check at a glance —
      # Dependabot updates both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks scans commit history, so a shallow clone would check only
          # the tip and report clean on a secret added two commits ago.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: yarn install --immutable

      # `migrate deploy` applies committed migrations without trying to author
      # new ones, which is what a non-interactive environment needs.
      - run: yarn workspace @wallet/api exec prisma migrate deploy

      - run: yarn verify
      - run: yarn npm audit --all --recursive

  # Migrations, applied by a role with the privileges the deployed one has.
  #
  # This job exists because a migration passed CI and broke production. It used
  # `SET LOCAL session_replication_role`, which needs superuser; CI's service
  # container runs as one and Neon's role does not, so the difference was
  # invisible until `migrate deploy` failed against the real database and
  # blocked every migration behind it (P3009).
  #
  # The `test` job above cannot cover this. It needs a superuser to reset the
  # schema between runs, and the whole point here is a role that is not one.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable

      # An owner, not a superuser — the shape Neon gives an application.
      - name: create a reduced-privilege role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c \
            "CREATE ROLE migrator LOGIN PASSWORD 'migrator' NOSUPERUSER"
          psql -h localhost -U postgres -c \
            "CREATE DATABASE wallet_asdeployed OWNER migrator"

      # Without this the job is theatre: if the role could set the parameter
      # after all, every assertion below would pass while testing nothing. The
      # probe has to be shown to be faithful before its result means anything.
      - name: prove the role really is restricted
        env:
          PGPASSWORD: migrator
        run: |
          if psql -h localhost -U migrator -d wallet_asdeployed \
               -c "SET session_replication_role = 'replica'" 2>/dev/null; then
            echo "::error::the probe role is not restricted — this job would pass vacuously"
            exit 1
          fi
          echo "role cannot set session_replication_role, as on the deployed database"

      - name: apply every migration as that role
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://migrator:migrator@localhost:5432/wallet_asdeployed?schema=public
        run: yarn prisma migrate deploy

  # The Lighthouse budget (docs/spec.md, NFR-2.1), and the control that proves
  # the budget can fail.
  #
  # This job exists because four category scores were written down in
  # `docs/runbook.md` as a quality bar and nothing checked them. A written
  # budget that nothing enforces reads as a decision while being an intention —
  # the same failure `size-budget.ts` was written to close for the bundle.
  #
  # It runs on every pull request rather than only on ones touching `apps/web`.
  # A `paths` filter would skip the job on the others, and a skipped job is not
  # a failed one, so the aggregate below would have to treat "skipped" as a
  # pass. That is precisely the shape of gate this repository has been removing.
  # The cost is wall-clock in a parallel job, not developer time.
  lighthouse:
    runs-on: ubuntu-latest
    # Observed 3m22s: 72s for the control's six Lighthouse runs, 68s for the
    # budget's six, the rest image pull, install and build. Fifteen leaves room
    # for a cold cache without leaving room for a hang, which is the same
    # reasoning as the ten on the test job.
    #
    # Worth knowing before raising this: the first version of the job ran for
    # twenty minutes and was cancelled part-way through the measurement, and
    # that was not slowness. The budget was deadlocked against its own preview
    # server. A Lighthouse run here takes about twelve seconds; a run taking
    # minutes is a bug, not a busy runner.
    timeout-minutes: 15

    # The browser pinned by digest, the way the database is above (P-3). Chrome
    # is the single largest input to a Lighthouse number, and an unpinned one
    # turns "the score moved" into a question nobody can answer — the build
    # changed, or Chrome did, and the run cannot say which.
    #
    # Pinning it as the job's container rather than installing a browser also
    # pins the Node, the glibc and the fonts, which all reach the measurement.
    # mcr.microsoft.com/playwright:v1.62.1-noble, multi-arch index digest.
    #
    # The default /dev/shm in a container is 64 MB and Chrome needs more than
    # that to render without falling back to disk, which would show up as a
    # slower page rather than as an error.
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --shm-size=1g

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: locate the pinned browser
        run: |
          CHROME="$(find /ms-playwright/chromium-* -maxdepth 3 -type f -name chrome | head -1)"
          if [ -z "$CHROME" ]; then
            echo "::error::no chromium in the pinned image — the digest moved or the layout changed"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - run: corepack enable
      - run: yarn install --immutable

      # `@wallet/shared` first. The web build imports it through `dist`, which
      # only exists because the root `build` script runs `--topological`;
      # building the web workspace alone fails to resolve the import.
      - name: build the production bundle
        run: |
          yarn workspace @wallet/shared build
          yarn workspace @wallet/web build

      # The control runs before the measurement, for the same reason the
      # migrations job proves its role is restricted before applying anything:
      # a reading from an instrument that has not been shown to respond is not
      # evidence. This weights `dist/index.html` with a 600 ms blocking script
      # and requires the budget to refuse it. If the budget passes that, the
      # job fails here and the green below would have meant nothing.
      - name: control — a deliberately heavy build must blow the budget
        run: yarn workspace @wallet/web lighthouse:control

      - name: the budget itself
        run: yarn workspace @wallet/web lighthouse

      # The reports are what a red budget is diagnosed from. Uploaded on
      # failure too — especially on failure.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: lighthouse-report
          path: apps/web/lighthouse-report/
          retention-days: 14

  # Its own job because it needs neither Node nor Postgres, and because running
  # it inside the matrix would scan the same history once per Node version.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # NFR-1.9 and 17.3 name gitleaks three times between them. Pinned by
      # digest rather than by tag: an image tag is mutable, and a secret
      # scanner is the last place to accept "whatever is there today".
      #
      # `--baseline-path` accepts the two findings this repository's history
      # genuinely contains — a placeholder in `.env.example` and a test constant
      # in `helpers.ts`, both from e3f6d6e — by fingerprint. It replaces an
      # allowlist that granted the whole commit and the whole of `.env.example`,
      # which is the file documenting every production secret.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --baseline-path=/repo/.gitleaks-baseline.json --redact --no-banner

  # The one name branch protection requires, and the reason it exists.
  #
  # Splitting `verify` into a matrix renamed its checks to `verify (22)` and
  # `verify (24)`, so the required check `verify` stopped reporting entirely and
  # every pull request became permanently unmergeable. Requiring the matrix legs
  # by name instead would move the problem rather than fix it: adding Node 26
  # later, or dropping 22, silently drops a required check again and the rule
  # would have to be edited in the repository settings, where nothing in this
  # repository can see it.
  #
  # An aggregate keeps one stable contract with branch protection while the jobs
  # behind it change freely.
  verify:
    needs: [test, migrations, secrets, lighthouse]
    # `always()`, because a job whose dependency failed is *skipped*, and a
    # skipped required check is not a failed one — which would make this gate
    # pass by not running.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: every job succeeded
        run: |
          echo "test=${{ needs.test.result }}"
          echo "migrations=${{ needs.migrations.result }}"
          echo "secrets=${{ needs.secrets.result }}"
          echo "lighthouse=${{ needs.lighthouse.result }}"
          [ "${{ needs.test.result }}" = "success" ] || exit 1
          [ "${{ needs.migrations.result }}" = "success" ] || exit 1
          [ "${{ needs.secrets.result }}" = "success" ] || exit 1
          [ "${{ needs.lighthouse.result }}" = "success" ] || exit 1
